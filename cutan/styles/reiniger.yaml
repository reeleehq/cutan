# Lotte Reiniger silhouette film. See the header of south_park.yaml for how to read this file.
style: reiniger
schema_version: "0.1.0"
title: Lotte Reiniger (silhouette film)
cost_class: high
cost_note: puppets of 20-50 hinged pieces; the engine mostly exists, the puppets do not

live:
  meta:
    fps: 24
    default_easing: ease_in_out     # naturalistic, studied movement
    step_hz: 12              # an estimate: the source cadence is not established
  environment:
    # plane offsets and sizes are scene pixels from the stage centre at the default
    # 1920x1080; scale them with meta.resolution
    descriptor:              # blue-tinted translucent layers on a backlit glass table
      name: glass_table
      planes:
        - {name: backlight, art: {kind: fill, color: "#0068e5"}, depth: 0.2}
        - {name: far_hills, art: {kind: fill, color: "#048def"}, depth: 0.5, offset: [0, 120], size: [5000, 200]}
        - {name: near_ground, art: {kind: fill, color: "#011945"}, depth: 0.8, offset: [0, 240], size: [5000, 160]}
        - {name: foreground_reeds, art: {kind: fill, color: "#000000"}, depth: 1.2, offset: [0, 300], size: [6000, 80]}
      characters_after: near_ground
  camera:
    default: hold
    allowed: [hold, pan_left, pan_right]   # slow pans
  easing: [ease_in_out]      # naturalistic, studied movement
  tween_duration_s: [0.5, 2.0]
  motion_presets: [turn]     # cutan.motion.PRESETS; a turn keeps to profiles, to `side` facing left or right
  shots:
    mean_s: 12               # measured, n=5
    range_s: [6, 20]
  characters:
    generate: offline
    tint: "#000000"          # a `tint` set on each character root: a black multiply is a silhouette
    part_tints:              # a `set` of `tint` on each of these parts of every character at `at: 0`: a part's tint REPLACES the root's (an#273), so the eyes are cut out of the black and a blink shows the black lid closing over them
      head/left_sclera: "#ffffff"
      head/right_sclera: "#ffffff"
    view: side               # a `set` of `view` on each character root at `at: 0` in every shot: the profile IS the silhouette; a negative `scale_x` faces left
  transitions:
    default: {kind: dissolve, duration: 1.0}   # between painted plates; the duration is an estimate
  sound:
    bed: {loop: true, fade_in: 2.0, fade_out: 3.0}   # the score carries the film: no dialogue, so no ducking

policy:                      # cutan#9 (ADR 0002 decision 4): method orders the compiler applies; the author's request, then a shot's policy, win over it
  locomotion: [loco.profile_cycle, loco.legged_cycle]   # the profile cycle while the side view shows (cutan#17); legs otherwise, the skip recorded
  speech: [speech.pose_only]  # a silhouette mimes: its mouth chart is drawn black on black (an#273), so speech is the head's pulse
targets:
  top16_colour_coverage: [0.65, 0.80]   # measured 0.74, the flattest of the six
  cuts_per_min: [3, 5]                  # measured 4.0

guidance:
  construction: black cardboard puppets of 20-50 pieces with wire hinges; rigs are flat in `an` today, so deep hierarchies are untested
  expression: pose and profile only, no mouth animation; the policy makes speech the head's pulse (`speech.pose_only`; the profile is `live.characters.view`; turn with a `turn` play to `side`); the factory's profile is a round head with a nose, not a cut-paper face
  transitions: a dissolve marks a change of time or place; continuous action on one set is a cut or a single shot, whatever the cuts-per-minute target says (an#273)
  shot_timing: shot lengths counted to the music; cut to the bed's bars by hand (nothing reads the music's tempo)
  text: ornamental-script intertitles, cyan on dark blue — an overlay text prop with an ornamental font FILE over a dark-blue fill plane; the geometric border is SVG prop art or path props
  sound: a composed score, no dialogue; bring a licensed or public-domain recording for `live.sound`'s bed
