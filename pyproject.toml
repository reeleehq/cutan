[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "cutan"
version = "0.0.1"
description = "Cut-out animation for an: rigged characters, faces, lip-sync and styles, as a genre package on the an core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "animation",
    "cut-out",
    "cutout",
    "lip-sync",
    "an",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
# `an` is the core this genre registers with (ADR 0001). Unversioned, per the
# local-package convention; the lowest `an` cutan supports is declared here
# when the first module moves.
dependencies = [
    "an",
]

# RESERVED, not declared yet (an#225). The genre object still ships inside
# `an`, which declares it under this same name; the batch that moves `CUTOUT`
# here uncomments this table and drops `an`'s line in the same coordinated
# release. `an.genres` de-duplicates by entry-point name, `an`'s own first.
# tests/test_scaffold.py fails if this is declared before then.
#
# [project.entry-points."an.genres"]
# cutout_animation = "cutan.genre:CUTOUT"

[project.urls]
Homepage = "https://github.com/thorwhalen/cutan"
Repository = "https://github.com/thorwhalen/cutan"
Documentation = "https://thorwhalen.github.io/cutan"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    "scrap",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    "**/*.md",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
    "cutan",
]
# The same two flags as `an` (and as its CI passes), so a doctest moved from
# `an` behaves the same here.
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

# OFF until the first batch of an#225 gives the package real content: a
# release now would put an empty package on PyPI. That batch sets `true`.
[tool.wads.ci.publish]
enabled = false
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
